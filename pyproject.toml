[project]
name = "xromm-dlctools"
version = "0.1.0"
description = "Helper utilities for XMALab ↔ DeepLabCut workflows in XROMM processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "opencv-python-headless",
  "h5py",
  "tables",
]

[project.scripts]
xrommtools = "xrommtools.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.8.0",
]
dlc = [
  "deeplabcut",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xrommtools"]

[tool.uv.sources]
deeplabcut = { path = "../DeepLabCut" }
